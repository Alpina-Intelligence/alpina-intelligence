# Shape of a per-app secret sync. The real ones live in each project's own repo, next to
# that project's Deployment — this file is the reference, not a deployed object.
#
# NAMESPACE IS LOAD-BEARING. The operator resolves spec.authToken.secretName in the
# BitwardenSecret's OWN namespace, not the operator's:
#
#     namespacedAuthK8sSecret := types.NamespacedName{
#         Name:      bwSecret.Spec.AuthToken.SecretName,
#         Namespace: req.NamespacedName.Namespace,   // <- the CR's namespace
#     }
#
# So a bw-auth-token in sm-operator-system is not visible to a CR in puckprophet. Every
# namespace that syncs secrets needs its own copy of the auth token secret.

apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: puckprophet
  namespace: puckprophet
spec:
  # Bitwarden organization UUID. Dashboard → Settings → Organization info, or the org GUID
  # in the vault URL. Same for every CR here.
  organizationId: "<org-uuid>"

  # The k8s Secret this creates, in this namespace. App manifests reference it by this name
  # via secretKeyRef — they never know Bitwarden exists.
  secretName: puckprophet-secrets

  # true = sync ONLY what `map` lists. Keep it true: with false, every secret the machine
  # account can read lands in the Secret keyed by UUID, so widening the account's scope
  # later would silently widen this Secret too.
  onlyMappedSecrets: true

  map:
    - bwSecretId: "<secret-uuid>"
      secretKeyName: BETTER_AUTH_SECRET
    - bwSecretId: "<secret-uuid>"
      secretKeyName: PGPASSWORD

  # PGPASSWORD lives here rather than on the box: provision-db.sh applies it to the role
  # from stdin and stores nothing, so Bitwarden is the only durable copy. Rotating means
  # updating Bitwarden, re-running that script, and restarting the pods — see
  # infra/postgres/README.md.

  authToken:
    secretName: bw-auth-token
    secretKey: token
