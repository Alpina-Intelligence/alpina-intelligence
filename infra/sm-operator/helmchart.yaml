# Bitwarden Secrets Manager operator, installed via k3s's built-in helm-controller.
#
# WHY a HelmChart CRD rather than `helm install`: no helm binary on the box, the version is
# pinned in a file that lives in git, and it is the same declarative shape Flux's HelmRelease
# will take later. Applying this manifest makes k3s run the install as a Job in kube-system.
#
# Chart 2.0.3 → appVersion 2.1.0. Pin BOTH ideas in your head: they are different numbers.
# v2.1.0 is the floor for correctness — before it, the reconciler only synced a BitwardenSecret
# once and never again unless the CR itself was edited (bitwarden/sm-kubernetes#157). A rotated
# secret would silently never arrive. Never run an older appVersion.

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sm-operator
  namespace: kube-system
spec:
  repo: https://charts.bitwarden.com/
  chart: sm-operator
  version: 2.0.3
  targetNamespace: sm-operator-system
  createNamespace: true
  valuesContent: |-
    settings:
      # Seconds between syncs. The chart default; the operator rejects anything under 180.
      # This is also the worst-case lag between rotating a value in Bitwarden and the k8s
      # Secret changing — which is NOT the same as the app seeing it. See the README.
      bwSecretsManagerRefreshInterval: 300
      cloudRegion: US
      replicas: 1
    containers:
      manager:
        # Single node, so leader election buys nothing and costs a lease.
        enableLeaderElection: false
